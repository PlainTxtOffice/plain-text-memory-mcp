#:schema https://json.schemastore.org/pyproject.json

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plain-text-memory-mcp"
version = "0.4.1"
description = "MCP server that gathers a repo's Markdown memory files into one searchable, stamped knowledge graph"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Plain Text Office LLC" }]
# PyPI shows this address for bug reports and feature requests.
maintainers = [{ name = "Plain Text Office LLC", email = "support@plaintxtoffice.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "memory",
    "knowledge-graph",
    "claude-code",
    "codex",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = ["mcp>=2.2,<3"]

[project.urls]
Homepage = "https://github.com/PlainTxtOffice/plain-text-memory-mcp"
Issues = "https://github.com/PlainTxtOffice/plain-text-memory-mcp/issues"
Feedback = "https://plaintxtoffice.com/contact/"

[project.scripts]
plain-text-memory-mcp = "plain_text_memory_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "rumdl>=0.0.170", "mypy>=1.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plain_text_memory_mcp = ["taxonomy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
# Keep pytest temp folders outside the repository and isolate each account.
addopts = "-s"
tmp_path_retention_policy = "none"
cache_dir = "$PYTEST_ACCOUNT_ROOT/cache"


[tool.mypy]
exclude = ['(^|[\\/])tests([\\/]|$)']
ignore_missing_imports = true

[tool.ruff]
line-length = 80
